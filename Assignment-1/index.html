<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Color Challenge</title>
    <style>
        body {
            font-family: serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            background-color: #007bff;
            color: #0000ff;
            font-size: 45px;
            font-weight: bold;
            padding: 10px;
            margin: 0 0 20px 0;
        }

        .subtitle {
            color: #9c27b0;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .yellow-bar {
            background-color: #ffff00;
            color: #ffca28;
            font-size: 18px;
            padding: 5px;
            margin-bottom: 15px;
        }

        .green-bar {
            background-color: #c1d5c0;
            color: #000000;
            font-size: 18px;
            padding: 5px;
        }
    </style>
</head>
<body>

    <div class="header">CSS Color Challenge</div>
    
    <div class="subtitle">Explore the spectrum of colors!</div>
    
    <div class="yellow-bar">Hello world, how are you?</div>
    
    <div class="green-bar">Unstyled Paragraph</div>

</body>
</html>
